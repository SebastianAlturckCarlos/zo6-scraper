name: AXS ticket price watch

# The Tucker Wetmore show was 13 Aug 2026 and has passed, so the schedule is
# switched off: no cron, manual runs only.  To watch another event, set the
# EVENT_URL / EVENT_NAME variables, update SOURCES in ticket_watch.py, delete
# ticket_prices.json to clear the baseline, and restore the cron line below:
#   schedule:
#     - cron: "*/30 * * * *"
on:
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send one sample alert to prove the mail path, then stop"
        type: boolean
        default: false

# Two scheduled workflows in this repository commit state files; without this
# the second one to finish can clobber or fail against the first.
concurrency:
  group: repo-state-commit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ticket-watch/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r ticket-watch/requirements.txt

      - name: Install Chromium for the browser fallback
        run: python -m playwright install --with-deps chromium

      - name: Check ticket prices and email on a change
        env:
          # Retry in a real browser when plain HTTP is challenged.
          USE_BROWSER: "1"
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Defaults to sebastianrhoton@gmail.com when the secret is unset.
          TICKET_ALERT_EMAIL: ${{ secrets.TICKET_ALERT_EMAIL }}
          # Optional overrides - see ticket-watch/README.md.
          EVENT_URL: ${{ vars.EVENT_URL }}
          EVENT_NAME: ${{ vars.EVENT_NAME }}
          PRICE_CHANGE_THRESHOLD: ${{ vars.PRICE_CHANGE_THRESHOLD }}
          PRICE_TARGET: ${{ vars.PRICE_TARGET }}
          # Optional: residential proxy URL, for when AXS blocks the runner IP.
          TICKET_PROXY: ${{ secrets.TICKET_PROXY }}
        run: python ticket-watch/ticket_watch.py ${{ inputs.test_email && '--test-email' || '' }}

      - name: Save the recorded prices
        run: |
          state="ticket-watch/ticket_prices.json ticket-watch/price_history.jsonl"
          if [ -z "$(git status --porcelain -- $state)" ]; then
            echo "No price changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # On a failed read only the state file is written, so add each path
          # that actually exists: "git add" hard-errors on a missing pathspec.
          for path in $state; do
            if [ -f "$path" ]; then git add "$path"; fi
          done
          git commit -m "chore: update watched AXS ticket prices"
          for attempt in 1 2 3 4; do
            if git push; then exit 0; fi
            echo "Push failed (attempt $attempt); rebasing on the remote and retrying."
            sleep $((2 ** attempt))
            git pull --rebase
          done
          exit 1
